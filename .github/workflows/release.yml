name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.capture_source.outputs.source_sha }}
      artifact_id: ${{ steps.upload_distributions.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_distributions.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Capture exact source commit
        id: capture_source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test -n "$source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - id: upload_distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-premiere
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
      - name: Verify immutable release provenance
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)"
          release_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq .target_commitish)"
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_target" --jq .sha)"
          test "$tag_sha" = "$SOURCE_SHA"
          test "$release_sha" = "$SOURCE_SHA"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          verbose: true
          print-hash: true

  attach-github-release:
    needs: [release-please, build, publish-pypi]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
      - name: Verify provenance and attach release assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)"
          release_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq .target_commitish)"
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_target" --jq .sha)"
          test "$tag_sha" = "$SOURCE_SHA"
          test "$release_sha" = "$SOURCE_SHA"
          gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY"
